<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Avisa INIA</title>
  <link rel="icon" href="/avisa-icon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/avisa-icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">

  <!-- Tema: fijar antes del primer pintado para evitar parpadeo -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sf-theme');
        // Claro por defecto, igual que el landing (marca Avisa 2026-10)
        if (t !== 'dark' && t !== 'light') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Hoja compartida con /recuperar y /nueva-clave (antes vivía inline acá) -->
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
<div class="stripe"></div>
<div class="page">

  <header>
    <div class="logos">
      <a href="/avisa" class="logo-link">
        <img src="/avisa-logo.png" alt="Avisa — Asistente Virtual de Información Satelital y Agroclimática · INIA" class="logo-avisa">
      </a>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Cambiar entre claro y oscuro" title="Cambiar entre claro y oscuro">
        <svg id="theme-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"></svg>
      </button>
      <a href="/avisa" class="back-link">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        <span>Volver</span>
      </a>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="card">
        <span class="kicker">Avisa · INIA</span>
        <div class="card-title">Inicia sesión</div>
        <div class="card-subtitle">Entra para ver tus campos, tus avisos y conversar con Avisa.</div>

        <!-- Entrar con proveedor: primero, es el camino de menos fricción.
             Oculto hasta confirmar que Supabase los tiene habilitados
             (ver aplicarProveedoresDisponibles en auth-common.js). -->
        <div class="oauth-row" id="oauth-row" style="display:none">
          <button class="btn-oauth" data-provider="google" disabled data-needs-auth
                  onclick="signInWithProvider('google', '/app', this)"></button>
          <button class="btn-oauth" data-provider="azure" disabled data-needs-auth
                  onclick="signInWithProvider('azure', '/app', this)"></button>
        </div>

        <div class="sep-o" id="oauth-sep" style="display:none">o con tu correo</div>

        <div class="form-grid">
          <div id="f-email" class="field">
            <label class="required">Tu correo (email)</label>
            <input type="email" id="email" placeholder="Ej: juan@gmail.com" autocomplete="email">
            <div class="error-msg">Escribe un correo válido, como juan@gmail.com</div>
          </div>

          <div id="f-password" class="field">
            <label class="required">Tu contraseña</label>
            <div class="pwd-wrap">
              <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password">
              <button type="button" class="pwd-toggle" id="pwd-toggle" aria-label="Mostrar contraseña"
                      onclick="togglePassword('password','pwd-toggle','pwd-eye')">
                <svg id="pwd-eye" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="error-msg">Ingresa tu contraseña</div>
            <div class="forgot-row">
              <a href="/recuperar">¿Olvidaste tu contraseña?</a>
            </div>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary btn-lg btn-block" id="btn-login" onclick="handleLogin()"
                  disabled data-needs-auth>
            Iniciar sesión
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

        <div class="switch-row">
          ¿No tienes cuenta? <a href="/registro">Solicita acceso</a>
        </div>
      </div>

      <div class="help-note">
        ¿Necesitas ayuda? <a id="help-link" href="#" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>
      </div>
      <div class="servicio">
        Un servicio de
        <img src="/smartfield-logo.png" alt="Smartfield INIA" class="logo-sfi-light">
        <img src="/smartfield-logo-dark.png" alt="" aria-hidden="true" class="logo-sfi-dark">
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>

<!-- CDN scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js" integrity="sha384-yiVMs0R/Jyz7OhoXa/DsEMUSBLjEhr/QJta2ONO+zB6I8/GmNg/7AUFrZmAJV7KV" crossorigin="anonymous"></script>
<script src="/auth-common.js"></script>

<script>
let supabaseClient = null;

['email', 'password'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleLogin();
    }
  });
});

async function handleLogin() {
  const email    = val('email');
  const password = val('password');
  let ok = true;
  ok = require('email', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? email : '', 'Email inválido') && ok;
  ok = require('password', password, 'Ingresa tu contraseña') && ok;
  if (!ok) return;

  const client = getAuthClient();
  if (!client) return;

  const btn = document.getElementById('btn-login');
  btnLoading(btn, true, 'Entrando…');
  try {
    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) { showToast(translateError(error.message)); return; }
    window.location.href = '/app';
  } catch (err) {
    showToast('Error inesperado: ' + err.message);
  } finally {
    btnLoading(btn, false);
  }
}

// ═══════════════════════════════════════════════════════════
// INIT — si ya hay sesión activa, saltar directo a /app
// ═══════════════════════════════════════════════════════════
(async function init() {
  updateThemeIcon();
  renderProviderButtons();
  fillHelpLinks();
  try {
    const cfg = await fetch('/api/registro-config').then(r => r.json());
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
      showToast('Configuración no disponible. Intenta recargando la página.');
      return;
    }
    supabaseClient = window.supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      window.location.href = '/app';
      return;
    }

    authReady();

    // Solo después de descartar que ya hay sesión: si la había, esta página
    // desaparece igual y no vale la pena la consulta.
    await aplicarProveedoresDisponibles(cfg.supabaseUrl, cfg.supabaseAnonKey);
  } catch (e) {
    console.error('init login error:', e);
  }
})();
</script>
</body>
</html>
